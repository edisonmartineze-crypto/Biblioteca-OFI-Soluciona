<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="none">
<defs>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#b57635"/>
    <stop offset=".08" stop-color="#d29a57"/>
    <stop offset=".25" stop-color="#c98d49"/>
    <stop offset=".48" stop-color="#e1ad68"/>
    <stop offset=".72" stop-color="#c88946"/>
    <stop offset=".92" stop-color="#d39a57"/>
    <stop offset="1" stop-color="#a9692f"/>
  </linearGradient>
  <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e2ad6d"/>
    <stop offset=".45" stop-color="#bd7d3c"/>
    <stop offset="1" stop-color="#7b451f"/>
  </linearGradient>
  <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d9a562"/>
    <stop offset=".45" stop-color="#c28743"/>
    <stop offset="1" stop-color="#ad6e34"/>
  </linearGradient>
  <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".008 .07" numOctaves="2" seed="27"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer>
  </filter>
</defs>

<rect width="1600" height="1200" fill="url(#wood)"/>
<rect x="35" y="32" width="1530" height="1136" rx="10" fill="#7d471f"/>
<rect x="68" y="65" width="1464" height="1068" fill="url(#inner)"/>

<!-- inner depth shadows -->
<rect x="68" y="65" width="1464" height="36" fill="#5d3219" opacity=".48"/>
<rect x="68" y="65" width="34" height="1068" fill="#5d3219" opacity=".35"/>
<rect x="1498" y="65" width="34" height="1068" fill="#5d3219" opacity=".25"/>

<!-- three shelf planks -->
<g>
  <rect x="58" y="398" width="1484" height="35" fill="#4f2b16" opacity=".6" filter="url(#shadow)"/>
  <rect x="45" y="382" width="1510" height="32" rx="3" fill="url(#shelf)"/>
  <rect x="45" y="414" width="1510" height="15" fill="#6e3d1d"/>

  <rect x="58" y="760" width="1484" height="35" fill="#4f2b16" opacity=".6" filter="url(#shadow)"/>
  <rect x="45" y="744" width="1510" height="32" rx="3" fill="url(#shelf)"/>
  <rect x="45" y="776" width="1510" height="15" fill="#6e3d1d"/>

  <rect x="58" y="1115" width="1484" height="28" fill="#4f2b16" opacity=".6" filter="url(#shadow)"/>
  <rect x="45" y="1097" width="1510" height="32" rx="3" fill="url(#shelf)"/>
  <rect x="45" y="1129" width="1510" height="12" fill="#6e3d1d"/>
</g>

<!-- subtle original wood grain -->
<rect x="68" y="65" width="1464" height="1068" filter="url(#grain)" opacity=".7"/>
<g opacity=".16" stroke="#6d3e20" fill="none" stroke-width="3">
  <path d="M140 90 C210 170,105 250,165 355 S120 520,175 700 S115 920,190 1090"/>
  <path d="M410 72 C360 190,440 250,390 370 S460 600,405 730 S470 970,415 1120"/>
  <path d="M720 70 C670 220,750 330,705 430 S760 650,710 785 S790 1020,735 1120"/>
  <path d="M1030 72 C980 180,1070 280,1010 390 S1080 610,1020 750 S1080 960,1035 1120"/>
  <path d="M1335 75 C1280 205,1370 310,1315 440 S1380 650,1320 785 S1385 1010,1330 1120"/>
</g>
</svg>