<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5a351d">
<title>Biblioteca OFI Soluciona V7</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#70431f;color:#2b1b11}[hidden]{display:none!important}button{font:inherit}
.library{min-height:100vh;padding:16px clamp(8px,3vw,38px) 42px;background:linear-gradient(#32190b12,#32190b24),url("assets/estanteria.svg") center top/cover fixed}
.head{width:min(1220px,97vw);margin:0 auto 18px;padding:14px 17px;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff7e9eb;border:1px solid #60391d35;border-radius:16px;box-shadow:0 10px 28px #2b16082d}
.head h1{margin:0;font-size:clamp(22px,3.8vw,43px)}.head p{margin:4px 0 0;opacity:.65}
.refresh{border:0;border-radius:10px;background:#4c2c17;color:#fff;padding:10px 13px;cursor:pointer}
.grid{width:min(1260px,98vw);margin:auto;padding:34px 6px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:40px 28px;align-items:end}
.card{border:0;background:transparent;cursor:pointer;padding:0;color:inherit;display:flex;flex-direction:column;align-items:center}
.book{position:relative;width:min(225px,84%);aspect-ratio:.705;filter:drop-shadow(10px 16px 10px #29140770);transition:.18s}.card:hover .book{transform:translateY(-8px)}
.cover{position:absolute;left:9px;right:0;top:0;bottom:0;background:#eee;border-radius:3px 7px 7px 3px;overflow:hidden;box-shadow:inset 7px 0 8px #0003}.cover img{width:100%;height:100%;display:block;object-fit:cover;background:#fff}
.spine{position:absolute;left:0;top:5px;bottom:4px;width:11px;border-radius:3px 0 0 3px;background:linear-gradient(90deg,#3a2213,#84502b,#b97e48)}
.pages{position:absolute;right:-5px;top:7px;bottom:7px;width:7px;background:repeating-linear-gradient(0deg,#fffaf0 0 2px,#d7cbb9 2px 3px);transform:skewY(-5deg)}
.label{margin-top:12px;max-width:100%;padding:7px 10px;border-radius:9px;background:#fff7e9ed;text-align:center;box-shadow:0 5px 15px #2a150927}.title{display:block;font-weight:800;font-size:14px;line-height:1.2}.meta{display:block;font-size:11px;margin-top:3px;opacity:.62}.status{grid-column:1/-1;text-align:center;padding:45px;color:#fff;font-weight:700}
.viewer{position:fixed;inset:0;z-index:100;background:#34363a;display:flex;flex-direction:column}
.toolbar{height:54px;flex:0 0 54px;background:#1c1d20f3;color:#fff;display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid #ffffff16}
.icon{width:40px;height:40px;border:0;border-radius:9px;background:#ffffff10;color:#fff;font-size:20px;cursor:pointer}.vtitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}.ver{font-size:10px;opacity:.45}
.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;padding:8px}
#bookHost{width:100%;height:100%;display:grid;place-items:center}
.loading{position:absolute;inset:0;z-index:50;background:#34363a;color:#fff;display:grid;place-items:center;text-align:center}.loading.off{display:none}.spin{width:42px;height:42px;margin:0 auto 12px;border:4px solid #ffffff24;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:760px){.library{background-attachment:scroll;padding:9px 7px 28px}.head{padding:11px 12px}.head h1{font-size:21px}.head p{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:24px 2px;gap:28px 8px}.book{width:min(160px,90%)}.title{font-size:12px}.stage{padding:2px}}
</style>
</head>
<body>
<main class="library">
<header class="head"><div><h1>BIBLIOTECA OFI SOLUCIONA</h1><p>Publicaciones para lectura en línea</p></div><button class="refresh" id="refresh">↻ Actualizar</button></header>
<section class="grid" id="grid"><div class="status">Cargando biblioteca…</div></section>
</main>
<section class="viewer" id="viewer" hidden>
<div class="toolbar"><button class="icon" id="back">←</button><div class="vtitle" id="vtitle"></div><span class="ver">V7</span><button class="icon" id="full">⛶</button></div>
<div class="stage" id="stage"><div id="bookHost"></div><div class="loading" id="loading"><div><div class="spin"></div><div id="loadText">Preparando libro…</div><div id="prog" style="font-size:12px;opacity:.65;margin-top:8px"></div></div></div></div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const OWNER='edisonmartineze-crypto',REPO='Biblioteca-OFI-Soluciona',DIR='libros',$=s=>document.querySelector(s);
let books=[],pdfDoc=null,pageFlip=null,urls=[],session=0,currentPage=0;
const clean=n=>decodeURIComponent(n).replace(/\.pdf$/i,'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();
async function catalog(){try{const r=await fetch('catalogo.json',{cache:'no-store'});return r.ok?await r.json():[]}catch(e){return[]}}
async function gh(){try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}?ref=main`,{cache:'no-store'});if(!r.ok)return[];const a=await r.json();return a.filter(x=>x.type==='file'&&/\.pdf$/i.test(x.name)).map(x=>({file:x.name,title:clean(x.name),pdf:`${DIR}/${encodeURIComponent(x.name)}`,cover:`portadas/${encodeURIComponent(x.name.replace(/\.pdf$/i,'.webp'))}`}))}catch(e){return[]}}
async function discover(){let a=await catalog(),b=await gh();if(b.length){const m=new Map(a.map(x=>[x.file,x]));b.forEach(x=>m.set(x.file,{...(m.get(x.file)||{}),...x}));a=[...m.values()]}books=a.sort((x,y)=>x.title.localeCompare(y.title,'es'));render()}
function render(){const g=$('#grid');g.innerHTML='';if(!books.length){g.innerHTML='<div class="status">No se encontraron publicaciones.</div>';return}books.forEach(b=>{const c=document.createElement('button');c.className='card';c.innerHTML=`<div class="book"><div class="spine"></div><div class="cover"><img loading="lazy"></div><div class="pages"></div></div><div class="label"><span class="title"></span><span class="meta"></span></div>`;c.querySelector('.title').textContent=b.title;c.querySelector('.meta').textContent=b.pages?b.pages+' páginas':'PDF';const im=c.querySelector('img');im.src=b.cover||'';im.onerror=()=>im.style.display='none';c.onclick=()=>openBook(b);g.appendChild(c)})}
async function pageURL(doc,i,token){const p=await doc.getPage(i+1);if(token!==session)return null;const v0=p.getViewport({scale:1}),target=Math.min(1500,Math.max(1050,innerHeight*1.35)),v=p.getViewport({scale:target/v0.height}),cv=document.createElement('canvas');cv.width=Math.ceil(v.width);cv.height=Math.ceil(v.height);await p.render({canvasContext:cv.getContext('2d',{alpha:false}),viewport:v}).promise;if(token!==session)return null;const blob=await new Promise(r=>cv.toBlob(r,'image/webp',.82));if(!blob)return null;const u=URL.createObjectURL(blob);urls.push(u);return u}
async function destroyBook(){session++;if(pageFlip){try{pageFlip.destroy()}catch(e){}pageFlip=null}const d=pdfDoc;pdfDoc=null;if(d)try{await d.destroy()}catch(e){}urls.forEach(URL.revokeObjectURL);urls=[];$('#bookHost').innerHTML=''}
async function openBook(b){
 await destroyBook();const token=session;currentPage=0;$('#viewer').hidden=false;document.body.style.overflow='hidden';$('#vtitle').textContent=b.title;$('#loading').classList.remove('off');$('#loadText').textContent='Preparando páginas…';$('#prog').textContent='';
 try{
  const doc=await pdfjsLib.getDocument({url:b.pdf,disableRange:false,disableStream:false,disableAutoFetch:false}).promise;if(token!==session){doc.destroy();return}pdfDoc=doc;
  const p1=await doc.getPage(1),v=p1.getViewport({scale:1}),ratio=v.width/v.height;
  // StPageFlip loadFromImages needs image URLs. We render all pages once, then fullscreen/orientation never touches PDF.js.
  const arr=new Array(doc.numPages);let done=0,next=0,workers=Math.min(4,doc.numPages);
  async function worker(){while(next<doc.numPages){const i=next++;arr[i]=await pageURL(doc,i,token);done++;if(token!==session)return;$('#prog').textContent=done+' / '+doc.numPages}}
  await Promise.all(Array.from({length:workers},worker));if(token!==session)return;
  const st=$('#stage').getBoundingClientRect(),mobile=matchMedia('(max-width:760px)').matches;
  let h=Math.min(st.height-18, mobile?st.height-10:(st.width/2)/ratio),w=h*ratio;
  pageFlip=new St.PageFlip($('#bookHost'),{
   width:Math.max(220,Math.round(w)),height:Math.max(300,Math.round(h)),
   size:'stretch',minWidth:180,maxWidth:1600,minHeight:250,maxHeight:1900,
   showCover:true,usePortrait:mobile,autoSize:true,
   drawShadow:true,maxShadowOpacity:.55,flippingTime:700,
   mobileScrollSupport:false,swipingDistance:12,clickEventForward:true
  });
  pageFlip.loadFromImages(arr);
  pageFlip.on('flip',e=>{currentPage=e.data});
  $('#loading').classList.add('off');
 }catch(e){console.error(e);$('#loadText').textContent='No se pudo abrir este PDF.';$('#prog').textContent=''}
}
async function closeBook(){await destroyBook();$('#viewer').hidden=true;document.body.style.overflow=''}
$('#back').onclick=closeBook;$('#refresh').onclick=discover;
$('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('#viewer').requestFullscreen()}catch(e){}};
// IMPORTANT: resize/fullscreen does not rebuild, destroy or rerender pages.
document.addEventListener('fullscreenchange',()=>{if(pageFlip)setTimeout(()=>{try{pageFlip.updateFromImages(urls);pageFlip.flip(currentPage,'top')}catch(e){}},80)});
addEventListener('resize',()=>{}, {passive:true});
document.addEventListener('contextmenu',e=>{if(!$('#viewer').hidden)e.preventDefault()});
discover();
</script>
</body></html>
