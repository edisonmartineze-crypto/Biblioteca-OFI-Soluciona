<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b351c">
<title>Biblioteca OFI Soluciona V4</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#70431f;color:#2d1d12}
button,input{font:inherit}
[hidden]{display:none!important}

.library{
 min-height:100vh;padding:18px clamp(10px,3vw,38px) 44px;
 background:linear-gradient(#3c210d18,#3c210d28),url("assets/estanteria.svg") center top/cover fixed;
}
.head{
 width:min(1220px,97vw);margin:0 auto 18px;padding:15px 18px;
 display:flex;align-items:center;justify-content:space-between;gap:15px;
 background:#fff7e9e8;border:1px solid #603b1d38;border-radius:16px;
 box-shadow:0 10px 28px #2b16082d;backdrop-filter:blur(8px)
}
.head h1{margin:0;font-size:clamp(23px,3.7vw,43px);letter-spacing:.02em}
.head p{margin:4px 0 0;opacity:.68}
.refresh{border:0;border-radius:11px;background:#4d2d18;color:#fff;padding:10px 13px;cursor:pointer}

.grid{
 width:min(1260px,98vw);margin:auto;padding:35px 8px 30px;
 display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:40px 30px;align-items:end
}
.card{border:0;background:transparent;cursor:pointer;padding:0;color:inherit;display:flex;flex-direction:column;align-items:center}
.book{
 position:relative;width:min(225px,84%);aspect-ratio:.705;transform-origin:50% 100%;
 transition:.18s ease;filter:drop-shadow(10px 16px 11px #29140770)
}
.card:hover .book,.card:focus-visible .book{transform:translateY(-9px) rotateY(-3deg)}
.cover{position:absolute;left:9px;right:0;top:0;bottom:0;background:#eee;border-radius:3px 7px 7px 3px;overflow:hidden;box-shadow:inset 7px 0 8px #0003}
.cover img{width:100%;height:100%;display:block;object-fit:cover;background:#fff}
.spine{position:absolute;left:0;top:5px;bottom:4px;width:11px;border-radius:3px 0 0 3px;background:linear-gradient(90deg,#3b2314,#85512c,#b47a45)}
.pages{position:absolute;right:-5px;top:7px;bottom:7px;width:7px;background:repeating-linear-gradient(0deg,#fffaf0 0 2px,#d6cab8 2px 3px);transform:skewY(-5deg)}
.label{margin-top:12px;max-width:100%;padding:7px 10px;border-radius:9px;background:#fff7e9eb;box-shadow:0 5px 15px #2a150927;text-align:center}
.title{display:block;font-size:14px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.meta{display:block;font-size:11px;margin-top:3px;opacity:.62}
.status{grid-column:1/-1;text-align:center;padding:45px;color:#fff;font-weight:700;text-shadow:0 2px 5px #000}

.viewer{position:fixed;inset:0;background:#36383d;z-index:50;display:flex;flex-direction:column}
.toolbar,.bottom{background:#1d1e21f2;color:#fff;display:flex;align-items:center;gap:7px;z-index:70}
.toolbar{height:56px;padding:7px 9px;border-bottom:1px solid #ffffff18}
.bottom{min-height:54px;padding:6px 10px;justify-content:center;border-top:1px solid #ffffff18}
.vtitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.icon{width:40px;height:40px;border:0;border-radius:9px;background:#ffffff10;color:#fff;font-size:20px;cursor:pointer}
.icon:hover{background:#ffffff20}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;padding:10px 54px}
.flipbook{filter:drop-shadow(0 18px 30px #0009)}
.page{background:#fff;position:relative;overflow:hidden}
.page canvas{display:block;width:100%;height:100%;background:#fff}
.wait{position:absolute;inset:0;display:grid;place-items:center;color:#aaa}
.side{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:72px;border:0;border-radius:13px;background:#15161ab8;color:#fff;font-size:38px;z-index:65;cursor:pointer}
.side.prev{left:6px}.side.next{right:6px}
.counter{min-width:88px;text-align:center}
.range{width:min(430px,42vw)}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#303237;z-index:80;color:#fff}
.loading.off{display:none}
.spin{width:42px;height:42px;margin:0 auto 13px;border:4px solid #ffffff25;border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:760px){
 .library{background-attachment:scroll;padding:10px 8px 28px}
 .head{padding:11px 12px}.head p{display:none}.head h1{font-size:21px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:25px 2px;gap:28px 8px}
 .book{width:min(160px,90%)}.label{padding:6px 7px}.title{font-size:12px}
 .stage{padding:6px 1px}.side{width:36px;height:56px;font-size:29px;background:#15161a80}.side.prev{left:0}.side.next{right:0}
 .range,.desktop{display:none}.vtitle{font-size:13px}
}
</style>
</head>
<body>
<main id="library" class="library">
 <header class="head">
  <div><h1>BIBLIOTECA OFI SOLUCIONA</h1><p>Publicaciones para lectura en línea</p></div>
  <button id="refresh" class="refresh">↻ Actualizar</button>
 </header>
 <section id="grid" class="grid"><div class="status">Cargando biblioteca…</div></section>
</main>

<section id="viewer" class="viewer" hidden>
 <div class="toolbar">
  <button class="icon" id="back">←</button><div class="vtitle" id="vtitle"></div>
  <button class="icon desktop" id="zoomOut">−</button><button class="icon desktop" id="zoomIn">＋</button>
  <button class="icon" id="full">⛶</button>
 </div>
 <div class="stage" id="stage">
  <button class="side prev" id="prev">‹</button>
  <div class="loading" id="loading"><div style="text-align:center"><div class="spin"></div><div id="loadText">Abriendo publicación…</div></div></div>
  <div id="flipbook" class="flipbook"></div>
  <button class="side next" id="next">›</button>
 </div>
 <div class="bottom">
  <button class="icon" id="bprev">‹</button><span class="counter" id="counter">1 / 1</span>
  <input id="range" class="range" type="range" min="1" max="1" value="1">
  <button class="icon" id="bnext">›</button>
 </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const OWNER='edisonmartineze-crypto', REPO='Biblioteca-OFI-Soluciona', DIR='libros';
const $=s=>document.querySelector(s);
let books=[],pdfDoc=null,pageFlip=null,slots=[],rendered=new Set(),jobs=new Map(),zoom=1,current=null;

const clean=n=>decodeURIComponent(n).replace(/\.pdf$/i,'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();
const enc=p=>p.split('/').map(encodeURIComponent).join('/');

async function staticCatalog(){
 try{const r=await fetch('catalogo.json',{cache:'no-store'});return r.ok?await r.json():[]}catch(e){return[]}
}
async function localDiscover(){
 try{
  const r=await fetch(DIR+'/',{cache:'no-store'});if(!r.ok||(r.headers.get('content-type')||'').indexOf('text/html')<0)return[];
  const t=await r.text(),d=new DOMParser().parseFromString(t,'text/html');
  return [...new Set([...d.querySelectorAll('a')].map(a=>a.getAttribute('href')||'').filter(x=>/\.pdf(?:$|\?)/i.test(x)).map(x=>decodeURIComponent(x.split('?')[0].split('/').pop())))]
   .map(n=>({file:n,title:clean(n),pdf:`${DIR}/${encodeURIComponent(n)}`,cover:`portadas/${encodeURIComponent(n.replace(/\.pdf$/i,'.webp'))}`}));
 }catch(e){return[]}
}
async function githubDiscover(){
 try{
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}?ref=main`,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
  if(!r.ok)return[];const a=await r.json();if(!Array.isArray(a))return[];
  return a.filter(x=>x.type==='file'&&/\.pdf$/i.test(x.name)).map(x=>({file:x.name,title:clean(x.name),pdf:`${DIR}/${encodeURIComponent(x.name)}`,cover:`portadas/${encodeURIComponent(x.name.replace(/\.pdf$/i,'.webp'))}`}));
 }catch(e){return[]}
}
async function discover(){
 $('#grid').innerHTML='<div class="status">Cargando biblioteca…</div>';
 let base=await staticCatalog(); // instant known books
 render(base);
 let live=await localDiscover();if(!live.length)live=await githubDiscover();
 if(live.length){
   const by=new Map(base.map(x=>[x.file,x]));
   live.forEach(x=>by.set(x.file,{...(by.get(x.file)||{}),...x}));
   base=[...by.values()];
 }
 books=base.sort((a,b)=>a.title.localeCompare(b.title,'es',{sensitivity:'base'}));render(books);
}
function render(list){
 const g=$('#grid');g.innerHTML='';
 if(!list.length){g.innerHTML='<div class="status">No se encontraron publicaciones.</div>';return}
 list.forEach(b=>{
  const c=document.createElement('button');c.className='card';
  c.innerHTML=`<div class="book"><div class="spine"></div><div class="cover"><img loading="lazy"></div><div class="pages"></div></div>
   <div class="label"><span class="title"></span><span class="meta"></span></div>`;
  c.querySelector('.title').textContent=b.title;
  c.querySelector('.meta').textContent=b.pages?`${b.pages} páginas`:'PDF';
  const img=c.querySelector('img');img.src=b.cover||`portadas/${encodeURIComponent(b.file.replace(/\.pdf$/i,'.webp'))}`;
  img.alt=b.title;
  img.onerror=()=>fallbackCover(b,img,c.querySelector('.meta'));
  c.onclick=()=>openBook(b);g.appendChild(c);
 });
}
async function fallbackCover(b,img,meta){
 // Only if the lightweight WebP does not exist: then and only then touch the PDF.
 try{
  const d=await pdfjsLib.getDocument({url:b.pdf,disableAutoFetch:true}).promise;
  meta.textContent=`${d.numPages} páginas`;
  const p=await d.getPage(1),v0=p.getViewport({scale:1}),v=p.getViewport({scale:360/v0.width});
  const cv=document.createElement('canvas');cv.width=v.width;cv.height=v.height;
  await p.render({canvasContext:cv.getContext('2d',{alpha:false}),viewport:v}).promise;
  img.src=cv.toDataURL('image/jpeg',.76);await d.destroy();
 }catch(e){img.style.display='none';}
}
async function geometry(){
 const p=await pdfDoc.getPage(1),v=p.getViewport({scale:1}),ratio=v.width/v.height,m=matchMedia('(max-width:760px)').matches,s=$('#stage').getBoundingClientRect();
 let mw=m?s.width-8:(s.width-116)/2,mh=s.height-18,h=Math.min(mh,mw/ratio),w=h*ratio;
 return {w:Math.max(170,w),h:Math.max(230,h),mobile:m};
}
async function openBook(b){
 current=b;zoom=1;$('#viewer').hidden=false;document.body.style.overflow='hidden';$('#vtitle').textContent=b.title;
 $('#loading').classList.remove('off');$('#loadText').textContent='Abriendo publicación…';
 try{pdfDoc=await pdfjsLib.getDocument({url:b.pdf,disableAutoFetch:false}).promise;await build(0)}
 catch(e){console.error(e);$('#loadText').textContent='No se pudo abrir el PDF.'}
}
async function build(idx){
 const geo=await geometry(),host=$('#flipbook');host.innerHTML='';slots=[];rendered.clear();jobs.clear();
 for(let i=0;i<pdfDoc.numPages;i++){
  const pg=document.createElement('div');pg.className='page';pg.dataset.density=(i===0||i===pdfDoc.numPages-1)?'hard':'soft';
  const w=document.createElement('div');w.className='wait';w.textContent='…';
  const cv=document.createElement('canvas');cv.width=2;cv.height=2;pg.append(w,cv);host.appendChild(pg);slots.push({cv,w});
 }
 if(pageFlip)try{pageFlip.destroy()}catch(e){}
 pageFlip=new St.PageFlip(host,{
   width:geo.w,height:geo.h,size:'stretch',
   minWidth:170,maxWidth:1600,minHeight:230,maxHeight:1900,
   showCover:true,usePortrait:geo.mobile,autoSize:true,
   maxShadowOpacity:.5,mobileScrollSupport:false,swipingDistance:16,
   drawShadow:true,flippingTime:560
  });
 pageFlip.loadFromHTML(host.querySelectorAll('.page'));
 pageFlip.on('flip',e=>{counter(e.data+1);near(e.data)});
 $('#range').max=pdfDoc.numPages;pageFlip.flip(Math.min(idx,pdfDoc.numPages-1));counter(idx+1);
 await near(idx,true);$('#loading').classList.add('off');
}
async function renderPage(i){
 if(i<0||i>=pdfDoc.numPages||rendered.has(i))return;if(jobs.has(i))return jobs.get(i);
 const job=(async()=>{
  const p=await pdfDoc.getPage(i+1),slot=slots[i],rect=slot.cv.parentElement.getBoundingClientRect(),v0=p.getViewport({scale:1}),dpr=Math.min(1.7,devicePixelRatio||1);
  const cssH=Math.max(260,rect.height||600),v=p.getViewport({scale:(cssH/v0.height)*dpr*zoom});
  slot.cv.width=Math.ceil(v.width);slot.cv.height=Math.ceil(v.height);
  await p.render({canvasContext:slot.cv.getContext('2d',{alpha:false}),viewport:v}).promise;
  slot.w.style.display='none';rendered.add(i);jobs.delete(i);
 })().catch(e=>{jobs.delete(i);console.warn(e)});jobs.set(i,job);return job;
}
async function near(i,first=false){
 const a=[];for(let d=-1;d<=3;d++)a.push(i+d);if(first)a.unshift(0,1);
 await Promise.all(a.map(renderPage));
}
function counter(n){$('#counter').textContent=`${n} / ${pdfDoc?pdfDoc.numPages:1}`;$('#range').value=n}
const prev=()=>pageFlip?.flipPrev(),next=()=>pageFlip?.flipNext();
$('#prev').onclick=$('#bprev').onclick=prev;$('#next').onclick=$('#bnext').onclick=next;
$('#range').oninput=e=>{let i=+e.target.value-1;pageFlip?.flip(i);near(i)};
async function close(){
 if(pageFlip)try{pageFlip.destroy()}catch(e){}pageFlip=null;if(pdfDoc)try{await pdfDoc.destroy()}catch(e){}pdfDoc=null;
 $('#viewer').hidden=true;document.body.style.overflow=''
}
$('#back').onclick=close;
$('#full').onclick=async()=>{
 try{
   if(document.fullscreenElement){
     await document.exitFullscreen?.();
   }else{
     await $('#viewer').requestFullscreen?.();
   }
 }catch(e){console.warn('Pantalla completa:',e)}
};

document.addEventListener('fullscreenchange',()=>{
 if(!pdfDoc||$('#viewer').hidden||!pageFlip)return;
 requestAnimationFrame(()=>{
   const i=pageFlip.getCurrentPageIndex?.()||0;
   near(i);
 });
});
$('#zoomIn').onclick=async()=>{if(!pdfDoc||zoom>=1.5)return;let i=pageFlip?.getCurrentPageIndex?.()||0;zoom=Math.min(1.5,zoom+.2);$('#loading').classList.remove('off');$('#loadText').textContent='Aumentando resolución…';await build(i)}
$('#zoomOut').onclick=async()=>{if(!pdfDoc||zoom<=.8)return;let i=pageFlip?.getCurrentPageIndex?.()||0;zoom=Math.max(.8,zoom-.2);$('#loading').classList.remove('off');$('#loadText').textContent='Ajustando vista…';await build(i)}
let lastPortrait=matchMedia('(max-width:760px)').matches;
let rt;
addEventListener('resize',()=>{
 clearTimeout(rt);
 rt=setTimeout(async()=>{
   if(!pdfDoc||$('#viewer').hidden||!pageFlip)return;
   const nowPortrait=matchMedia('(max-width:760px)').matches;

   // Cambios de tamaño por pantalla completa, barras del navegador,
   // Safari/iPadOS, etc.: NO reconstruyen el libro.
   if(nowPortrait===lastPortrait){
     const i=pageFlip.getCurrentPageIndex?.()||0;
     near(i);
     return;
   }

   // Solo reconstruimos si realmente se cruza el modo móvil/escritorio.
   lastPortrait=nowPortrait;
   const i=pageFlip.getCurrentPageIndex?.()||0;
   $('#loading').classList.remove('off');
   $('#loadText').textContent='Ajustando orientación…';
   await build(i);
 },220);
});
addEventListener('keydown',e=>{if($('#viewer').hidden)return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key==='Escape'&&!document.fullscreenElement)close()});
document.addEventListener('contextmenu',e=>{if(!$('#viewer').hidden)e.preventDefault()});
$('#refresh').onclick=discover;
discover();
</script>
</body>
</html>
