<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5a351d">
<title>Biblioteca OFI Soluciona V6</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#70431f;color:#2b1b11}
button{font:inherit}
[hidden]{display:none!important}

.library{
 min-height:100vh;padding:16px clamp(8px,3vw,38px) 42px;
 background:linear-gradient(#32190b12,#32190b24),url("assets/estanteria.svg") center top/cover fixed;
}
.head{
 width:min(1220px,97vw);margin:0 auto 18px;padding:14px 17px;
 display:flex;align-items:center;justify-content:space-between;gap:14px;
 background:#fff7e9eb;border:1px solid #60391d35;border-radius:16px;
 box-shadow:0 10px 28px #2b16082d;backdrop-filter:blur(8px)
}
.head h1{margin:0;font-size:clamp(22px,3.8vw,43px)}
.head p{margin:4px 0 0;opacity:.65}
.refresh{border:0;border-radius:10px;background:#4c2c17;color:#fff;padding:10px 13px;cursor:pointer}
.grid{
 width:min(1260px,98vw);margin:auto;padding:34px 6px 28px;
 display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:40px 28px;align-items:end
}
.card{border:0;background:transparent;cursor:pointer;padding:0;color:inherit;display:flex;flex-direction:column;align-items:center}
.book{position:relative;width:min(225px,84%);aspect-ratio:.705;filter:drop-shadow(10px 16px 10px #29140770);transition:.18s}
.card:hover .book{transform:translateY(-8px)}
.cover{position:absolute;left:9px;right:0;top:0;bottom:0;background:#eee;border-radius:3px 7px 7px 3px;overflow:hidden;box-shadow:inset 7px 0 8px #0003}
.cover img{width:100%;height:100%;display:block;object-fit:cover;background:#fff}
.spine{position:absolute;left:0;top:5px;bottom:4px;width:11px;border-radius:3px 0 0 3px;background:linear-gradient(90deg,#3a2213,#84502b,#b97e48)}
.pages{position:absolute;right:-5px;top:7px;bottom:7px;width:7px;background:repeating-linear-gradient(0deg,#fffaf0 0 2px,#d7cbb9 2px 3px);transform:skewY(-5deg)}
.label{margin-top:12px;max-width:100%;padding:7px 10px;border-radius:9px;background:#fff7e9ed;text-align:center;box-shadow:0 5px 15px #2a150927}
.title{display:block;font-weight:800;font-size:14px;line-height:1.2}
.meta{display:block;font-size:11px;margin-top:3px;opacity:.62}
.status{grid-column:1/-1;text-align:center;padding:45px;color:#fff;font-weight:700;text-shadow:0 2px 5px #000}

.viewer{position:fixed;inset:0;z-index:100;background:#34363a;display:flex;flex-direction:column}
.viewer-head{
 height:52px;flex:0 0 52px;background:#1c1d20f3;color:#fff;
 display:flex;align-items:center;gap:9px;padding:6px 10px;border-bottom:1px solid #ffffff16
}
.back{width:40px;height:40px;border:0;border-radius:9px;background:#ffffff10;color:#fff;font-size:22px;cursor:pointer}
.back:hover{background:#ffffff20}
.viewer-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.ver{font-size:10px;opacity:.45}
#flipHost{
 position:relative;flex:1;min-height:0;width:100%;
 --fb-bg:#34363a;
 --fb-paper:#fff;
 --fb-control-bg:rgba(20,20,24,.78);
 --fb-control-fg:#fff;
 --fb-counter-fg:rgba(255,255,255,.9);
 --fb-shadow:0 26px 64px rgba(0,0,0,.45),0 10px 22px rgba(0,0,0,.30);
 --fb-fold-shadow:drop-shadow(0 10px 12px rgba(0,0,0,.30));
}
.viewer-message{
 position:absolute;inset:52px 0 0;z-index:140;display:none;place-items:center;
 background:#34363a;color:#fff;text-align:center;padding:30px
}
.viewer-message.show{display:grid}
@media(max-width:760px){
 .library{background-attachment:scroll;padding:9px 7px 28px}
 .head{padding:11px 12px}.head h1{font-size:21px}.head p{display:none}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:24px 2px;gap:28px 8px}
 .book{width:min(160px,90%)}.label{padding:6px 7px}.title{font-size:12px}
 .viewer-head{height:48px;flex-basis:48px}
}
</style>
</head>
<body>

<main class="library" id="library">
 <header class="head">
  <div><h1>BIBLIOTECA OFI SOLUCIONA</h1><p>Publicaciones para lectura en línea</p></div>
  <button class="refresh" id="refresh">↻ Actualizar</button>
 </header>
 <section class="grid" id="grid"><div class="status">Cargando biblioteca…</div></section>
</main>

<section class="viewer" id="viewer" hidden>
 <div class="viewer-head">
  <button class="back" id="back" title="Volver">←</button>
  <div class="viewer-title" id="viewerTitle"></div>
  <span class="ver">V6</span>
 </div>
 <div id="flipHost"></div>
 <div class="viewer-message" id="viewerMessage"><div id="viewerMessageText"></div></div>
</section>

<script src="https://cdn.jsdelivr.net/gh/SympleNZ/PDFlipbook@main/pdflipbook.js"></script>
<script>
const OWNER='edisonmartineze-crypto';
const REPO='Biblioteca-OFI-Soluciona';
const DIR='libros';
const $=s=>document.querySelector(s);
let books=[];
let activeBook=null;
let openingToken=0;

const clean=n=>decodeURIComponent(n).replace(/\.pdf$/i,'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();

async function staticCatalog(){
 try{
  const r=await fetch('catalogo.json',{cache:'no-store'});
  return r.ok?await r.json():[];
 }catch(e){return[]}
}
async function localDiscover(){
 try{
  const r=await fetch(DIR+'/',{cache:'no-store'});
  if(!r.ok||!(r.headers.get('content-type')||'').includes('text/html'))return[];
  const t=await r.text(),d=new DOMParser().parseFromString(t,'text/html');
  return [...new Set([...d.querySelectorAll('a')]
   .map(a=>a.getAttribute('href')||'')
   .filter(x=>/\.pdf(?:$|\?)/i.test(x))
   .map(x=>decodeURIComponent(x.split('?')[0].split('/').pop())))]
   .map(n=>({file:n,title:clean(n),pdf:`${DIR}/${encodeURIComponent(n)}`,cover:`portadas/${encodeURIComponent(n.replace(/\.pdf$/i,'.webp'))}`}));
 }catch(e){return[]}
}
async function githubDiscover(){
 try{
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}?ref=main`,{
   headers:{Accept:'application/vnd.github+json'},cache:'no-store'
  });
  if(!r.ok)return[];
  const a=await r.json(); if(!Array.isArray(a))return[];
  return a.filter(x=>x.type==='file'&&/\.pdf$/i.test(x.name))
   .map(x=>({file:x.name,title:clean(x.name),pdf:`${DIR}/${encodeURIComponent(x.name)}`,cover:`portadas/${encodeURIComponent(x.name.replace(/\.pdf$/i,'.webp'))}`}));
 }catch(e){return[]}
}

async function discover(){
 $('#grid').innerHTML='<div class="status">Cargando biblioteca…</div>';
 let base=await staticCatalog();
 renderLibrary(base);
 let live=await localDiscover();
 if(!live.length)live=await githubDiscover();
 if(live.length){
  const m=new Map(base.map(x=>[x.file,x]));
  live.forEach(x=>m.set(x.file,{...(m.get(x.file)||{}),...x}));
  base=[...m.values()];
 }
 books=base.sort((a,b)=>a.title.localeCompare(b.title,'es',{sensitivity:'base'}));
 renderLibrary(books);
}
function renderLibrary(list){
 const g=$('#grid');g.innerHTML='';
 if(!list.length){g.innerHTML='<div class="status">No se encontraron publicaciones.</div>';return}
 list.forEach(b=>{
  const c=document.createElement('button'); c.className='card';
  c.innerHTML=`<div class="book"><div class="spine"></div><div class="cover"><img loading="lazy"></div><div class="pages"></div></div>
    <div class="label"><span class="title"></span><span class="meta"></span></div>`;
  c.querySelector('.title').textContent=b.title;
  c.querySelector('.meta').textContent=b.pages?`${b.pages} páginas`:'PDF';
  const img=c.querySelector('img'); img.src=b.cover||''; img.alt=b.title;
  img.onerror=()=>{img.style.display='none'};
  c.onclick=()=>openPublication(b);
  g.appendChild(c);
 });
}

function showMessage(text){
 $('#viewerMessageText').textContent=text;
 $('#viewerMessage').classList.add('show');
}
function hideMessage(){ $('#viewerMessage').classList.remove('show') }

async function destroyCurrent(){
 const old=activeBook;
 activeBook=null;
 if(old){
  try{old.destroy()}catch(e){console.warn('destroy',e)}
 }
 const host=$('#flipHost');
 host.innerHTML='';
}

async function openPublication(b){
 const token=++openingToken;
 $('#viewer').hidden=false;
 document.body.style.overflow='hidden';
 $('#viewerTitle').textContent=b.title;
 showMessage('Abriendo publicación…');
 await destroyCurrent();

 if(token!==openingToken)return;

 if(!window.PDFlipbook){
  showMessage('No se pudo cargar el motor del flipbook. Recarga la página.');
  return;
 }

 try{
  activeBook=PDFlipbook.create($('#flipHost'),{
   url:b.pdf,
   startPage:1,
   duration:560,
   edgeSize:0.17,
   cornerFold:true,
   displayMode:'auto',
   controls:true,
   zoomSteps:[1,1.5,2,3],
   shadow:'fullscreen',
   arrows:true,
   pageNumbers:true,
   maxScale:1.8,
   padding:12
  });

  const host=$('#flipHost');
  const ready=()=>{ if(token===openingToken)hideMessage() };
  const error=e=>{
   if(token===openingToken)showMessage('No se pudo abrir este PDF.');
   console.error(e.detail?.error||e);
  };
  host.addEventListener('flipbook:ready',ready,{once:true});
  host.addEventListener('flipbook:error',error,{once:true});

  // Safety fallback: the library itself also shows status internally.
  setTimeout(()=>{if(token===openingToken)hideMessage()},2500);
 }catch(e){
  console.error(e);
  showMessage('No se pudo iniciar el visor.');
 }
}

async function closePublication(){
 ++openingToken;
 await destroyCurrent();
 $('#viewer').hidden=true;
 hideMessage();
 document.body.style.overflow='';
}
$('#back').onclick=closePublication;
$('#refresh').onclick=discover;

document.addEventListener('keydown',e=>{
 if(!$('#viewer').hidden && e.key==='Escape' && !document.fullscreenElement){
  closePublication();
 }
});
document.addEventListener('contextmenu',e=>{
 if(!$('#viewer').hidden)e.preventDefault();
});

discover();
</script>
</body>
</html>
