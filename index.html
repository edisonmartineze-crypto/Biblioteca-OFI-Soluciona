<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biblioteca Digital</title>
<style>
:root{--bg:#111318;--panel:#1b1f27;--text:#f5f6f8;--muted:#aeb6c3;--accent:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit}.library{min-height:100%;padding:28px}.brand{max-width:1100px;margin:auto}.brand h1{margin:0 0 6px;font-size:clamp(26px,4vw,42px)}.brand p{margin:0 0 28px;color:var(--muted)}
.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px}.book-card{background:transparent;border:0;color:inherit;text-align:left;cursor:pointer;padding:0}.cover{aspect-ratio:595.5/842.25;background:#30395f;border-radius:8px;box-shadow:0 16px 35px #0008;overflow:hidden;display:grid;place-items:center}.cover canvas{width:100%;height:100%;object-fit:cover}.book-card h2{font-size:17px;margin:13px 0 4px}.book-card span{color:var(--muted);font-size:14px}
.viewer{display:none;position:fixed;inset:0;background:#0d0f13;z-index:10}.viewer.open{display:flex;flex-direction:column}.toolbar{height:58px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#171a20;border-bottom:1px solid #ffffff14;z-index:30}.toolbar .title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.iconbtn{min-width:42px;height:42px;border:0;border-radius:8px;background:#ffffff0d;color:white;cursor:pointer}.iconbtn:hover{background:#ffffff1b}.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;padding:18px}.flipbook{filter:drop-shadow(0 18px 28px #000a)}.page{background:white;overflow:hidden}.page canvas{display:block;width:100%;height:100%}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#0d0f13;z-index:25}.loading.hide{display:none}.loading-box{text-align:center}.spinner{width:42px;height:42px;border:4px solid #ffffff22;border-top-color:white;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}
.bottom{height:58px;background:#171a20;border-top:1px solid #ffffff14;display:flex;justify-content:center;align-items:center;gap:12px;padding:8px;z-index:30}.counter{min-width:90px;text-align:center;color:#d7dbe2}.range{width:min(360px,35vw)}
@media(max-width:700px){.library{padding:20px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}.toolbar{height:54px}.stage{padding:8px}.bottom{height:58px}.range{display:none}.hide-mobile{display:none}}
</style>
</head>
<body>
<section class="library" id="library"><div class="brand"><h1>Biblioteca Digital</h1><p>Publicaciones disponibles para lectura en línea.</p></div><div class="grid" id="grid"></div></section>
<section class="viewer" id="viewer">
 <div class="toolbar"><button class="iconbtn" id="back" title="Volver">←</button><div class="title" id="viewerTitle"></div><button class="iconbtn hide-mobile" id="zoomOut" title="Alejar">−</button><button class="iconbtn hide-mobile" id="zoomIn" title="Acercar">＋</button><button class="iconbtn" id="full" title="Pantalla completa">⛶</button></div>
 <div class="stage" id="stage"><div class="loading" id="loading"><div class="loading-box"><div class="spinner"></div><div id="loadText">Preparando libro…</div></div></div><div class="flipbook" id="flipbook"></div></div>
 <div class="bottom"><button class="iconbtn" id="prev">‹</button><span class="counter" id="counter">1 / 1</span><input class="range" id="pageRange" type="range" min="1" max="1" value="1"><button class="iconbtn" id="next">›</button></div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const BOOKS=[{id:'personajes',title:'Personajes — Fotografía',author:'Edison Martínez',pdf:'libros/FOTOLIBRO.pdf'}];
const $=s=>document.querySelector(s); let pdfDoc=null,pageFlip=null,currentBook=null,zoom=1;
async function renderCover(book,holder){try{const doc=await pdfjsLib.getDocument(book.pdf).promise;const p=await doc.getPage(1);const vp=p.getViewport({scale:0.45});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;holder.appendChild(c);doc.destroy()}catch(e){holder.textContent='PDF'}}
function buildLibrary(){const grid=$('#grid');BOOKS.forEach(b=>{const btn=document.createElement('button');btn.className='book-card';btn.innerHTML='<div class="cover"></div><h2></h2><span></span>';btn.querySelector('h2').textContent=b.title;btn.querySelector('span').textContent=b.author;btn.onclick=()=>openBook(b);grid.appendChild(btn);renderCover(b,btn.querySelector('.cover'))})}
async function openBook(book){currentBook=book;zoom=1;$('#viewer').classList.add('open');$('#viewerTitle').textContent=book.title;$('#loading').classList.remove('hide');$('#loadText').textContent='Abriendo publicación…';$('#flipbook').innerHTML='';try{pdfDoc=await pdfjsLib.getDocument(book.pdf).promise;await makePages();}catch(e){$('#loadText').textContent='No se pudo abrir el PDF. En prueba local usa un servidor web; en GitHub Pages funcionará normalmente.';console.error(e)}}
async function makePages(){const host=$('#flipbook');host.innerHTML='';const mobile=matchMedia('(max-width:700px)').matches;const stage=$('#stage').getBoundingClientRect();const ratio=595.5/842.25;let h=Math.min(stage.height-24,mobile?stage.width/ratio:(stage.width/2)/ratio);h=Math.max(260,h)*zoom;let w=h*ratio;const renderScale=Math.min(2.2,Math.max(1,window.devicePixelRatio||1))*zoom;
for(let i=1;i<=pdfDoc.numPages;i++){if(i===1||i%8===0)$('#loadText').textContent=`Preparando páginas ${i} de ${pdfDoc.numPages}…`;const p=await pdfDoc.getPage(i);const base=p.getViewport({scale:1});const scale=(h/base.height)*renderScale;const vp=p.getViewport({scale});const div=document.createElement('div');div.className='page';div.dataset.density=(i===1||i===pdfDoc.numPages)?'hard':'soft';const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);div.appendChild(c);host.appendChild(div);await p.render({canvasContext:c.getContext('2d',{alpha:false}),viewport:vp}).promise}
if(pageFlip)try{pageFlip.destroy()}catch(e){} pageFlip=new St.PageFlip(host,{width:w,height:h,size:'fixed',minWidth:220,maxWidth:1200,minHeight:310,maxHeight:1700,showCover:true,usePortrait:mobile,autoSize:true,maxShadowOpacity:.45,mobileScrollSupport:false,clickEventForward:true,swipingDistance:20,useMouseEvents:true});pageFlip.loadFromHTML(host.querySelectorAll('.page'));pageFlip.on('flip',e=>updateCounter(e.data+1));$('#pageRange').max=pdfDoc.numPages;updateCounter(1);$('#loading').classList.add('hide')}
function updateCounter(n){$('#counter').textContent=`${n} / ${pdfDoc?pdfDoc.numPages:1}`;$('#pageRange').value=n}
$('#prev').onclick=()=>pageFlip&&pageFlip.flipPrev();$('#next').onclick=()=>pageFlip&&pageFlip.flipNext();$('#pageRange').oninput=e=>pageFlip&&pageFlip.flip(+e.target.value-1);$('#back').onclick=()=>{if(pageFlip)try{pageFlip.destroy()}catch(e){};pageFlip=null;if(pdfDoc)try{pdfDoc.destroy()}catch(e){};pdfDoc=null;$('#viewer').classList.remove('open')};
$('#full').onclick=()=>{if(!document.fullscreenElement)$('#viewer').requestFullscreen?.();else document.exitFullscreen?.()};
$('#zoomIn').onclick=async()=>{if(!pdfDoc||zoom>=1.35)return;zoom+=.15;$('#loading').classList.remove('hide');await makePages()};$('#zoomOut').onclick=async()=>{if(!pdfDoc||zoom<=.7)return;zoom-=.15;$('#loading').classList.remove('hide');await makePages()};
document.addEventListener('keydown',e=>{if(!$('#viewer').classList.contains('open'))return;if(e.key==='ArrowRight')pageFlip?.flipNext();if(e.key==='ArrowLeft')pageFlip?.flipPrev();if(e.key==='Escape'&&!document.fullscreenElement)$('#back').click()});
document.addEventListener('contextmenu',e=>{if($('#viewer').classList.contains('open'))e.preventDefault()});
buildLibrary();
</script>
</body></html>
