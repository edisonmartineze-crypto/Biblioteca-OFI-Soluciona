*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{background:#70431f;color:#2b1b11}button,input{font:inherit}[hidden]{display:none!important}.library{min-height:100vh;padding:16px clamp(8px,3vw,38px) 42px;background:linear-gradient(#32190b12,#32190b24),url('assets/estanteria.svg') center top/cover fixed}.head{width:min(1220px,97vw);margin:0 auto 18px;padding:14px 17px;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff7e9eb;border:1px solid #60391d35;border-radius:16px;box-shadow:0 10px 28px #2b16082d;backdrop-filter:blur(8px)}.head h1{margin:0;font-size:clamp(22px,3.8vw,43px)}.head p{margin:4px 0 0;opacity:.65}.refresh{border:0;border-radius:10px;background:#4c2c17;color:#fff;padding:10px 13px;cursor:pointer}.grid{width:min(1260px,98vw);margin:auto;padding:34px 6px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:40px 28px;align-items:end}.card{border:0;background:transparent;cursor:pointer;padding:0;color:inherit;display:flex;flex-direction:column;align-items:center}.book{position:relative;width:min(225px,84%);aspect-ratio:.705;filter:drop-shadow(10px 16px 10px #29140770);transition:.18s}.card:hover .book{transform:translateY(-8px)}.cover{position:absolute;left:9px;right:0;top:0;bottom:0;background:#eee;border-radius:3px 7px 7px 3px;overflow:hidden;box-shadow:inset 7px 0 8px #0003}.cover img{width:100%;height:100%;display:block;object-fit:cover;background:#fff}.spine{position:absolute;left:0;top:5px;bottom:4px;width:11px;border-radius:3px 0 0 3px;background:linear-gradient(90deg,#3a2213,#84502b,#b97e48)}.pages{position:absolute;right:-5px;top:7px;bottom:7px;width:7px;background:repeating-linear-gradient(0deg,#fffaf0 0 2px,#d7cbb9 2px 3px);transform:skewY(-5deg)}.label{margin-top:12px;max-width:100%;padding:7px 10px;border-radius:9px;background:#fff7e9ed;text-align:center;box-shadow:0 5px 15px #2a150927}.title{display:block;font-weight:800;font-size .viewer{position:fixed;inset:0;background:#34363a;z-index:50;display:flex;flex-direction:column}.toolbar,.bottom{background:#1c1d20f2;color:#fff;display:flex;align-items:center;gap:7px;z-index:100}.toolbar{height:56px;padding:7px 9px;border-bottom:1px solid #ffffff18}.bottom{min-height:54px;padding:6px 10px;justify-content:center;border-top:1px solid #ffffff18}.vtitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}.icon{width:40px;height:40px;border:0;border-radius:9px;background:#ffffff10;color:#fff;font-size:20px;cursor:pointer}.counter{min-width:92px;text-align:center}.range{width:min(430px,42vw)}.stage{position:relative;flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;padding:8px 52px}.spread{position:relative;display:flex;align-items:stretch;justify-content:center;max-width:100%;max-height:100%;perspective:2400px}.sheet{position:relative;background:#fff;overflow:hidden;box-shadow:0 10px 25px #0007;flex:0 0 auto}.sheet img{width:100%;height:100%;display:block;object-fit:contain;background:#fff;user-select:none;-webkit-user-drag:none}.sheet.blank{background:#eee}.gutter{width:2px;background:#1118;box-shadow:0 0 12px #0008;z-index:4}.flip-layer{position:absolute;inset:0;pointer-events:none;z-index:20;perspective:2400px}.flip-page{position:absolute;top:0;width:50%;height:100%;background:#fff;transform-style:preserve-3d;will-change:transform;box-shadow:0 12px 28px #0009}.flip-page.forward{right:0;transform-origin:left center;animation:ff .34s cubic-bezier(.24,.75,.3,1) forwards}.flip-page.backward{left:0;transform-origin:right center;animation:fb .34s cubic-bezier(.24,.75,.3,1) forwards}.flip-face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;overflow:hidden}.flip-face img{width:100%;height:100%;object-fit:contain;background:#fff}.flip-back{transform:rotateY(180deg)}@keyframes ff{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}@keyframes fb{from{transform:rotateY(0)}to{t <main class="library" id="library"><header class="head"><div><h1>BIBLIOTECA OFI SOLUCIONA</h1><p>Publicaciones para lectura en línea</p></div><button class="refresh" id="refresh">↻ Actualizar</button></header><section class="grid" id="grid"><div class="status">Cargando biblioteca…</div></section></main>
<section class="viewer" id="viewer" hidden><div class="toolbar"><button class="icon" id="back">←</button><div class="vtitle" id="vtitle"></div><button class="icon desktop" id="zoomOut">−</button><button class="icon desktop" id="zoomIn">＋</button><button class="icon" id="full">⛶</button></div><div class="stage" id="stage"><button class="side prev" id="prev">‹</button><div class="loading" id="loading"><div style="text-align:center"><div class="spin"></div><div id="loadText">Abriendo publicación…</div><div class="progress" id="progress"></div></div></div><div class="spread" id="spread"><div class="sheet left" id="leftSheet"><img id="leftImg" alt=""></div><div class="gutter" id="gutter"></div><div class="sheet right" id="rightSheet"><img id="rightImg" alt=""></div><div class="flip-layer" id="flipLayer"></div></div><button class="side next" id="next">›</button></div><div class="bottom"><button class="icon" id="bprev">‹</button><span class="counter" id="counter">1 / 1</span><input class="range" id="range" type="range" min="1" max="1" value="1"><button class="icon" id="bnext">›</button></div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const OWNER='edisonmartineze-crypto',REPO='Biblioteca-OFI-Soluciona',DIR='libros',$=s=>document.querySelector(s);let books=[],pdfDoc=null,currentBook=null,pageCache=new Map(),renderJobs=new Map(),accessOrder=[],currentIndex=0,pageRatio=.705,zoom=1,busy=false,portraitMode=false,prefetchDepth=12,fastTurns=0,lastTurnAt=0,renderGeneration=0;
const clean=n=>decodeURIComponent(n).replace(/\.pdf$/i,'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();
async function staticCatalog(){try{const r=await fetch('catalogo.json',{cache:'no-store'});return r.ok?await r.json():[]}catch(e){return[]}}
async function localDiscover(){try{const r=await fetch(DIR+'/',{cache:'no-store'});if(!r.ok||!(r.headers.get('content-type')||'').includes('text/html'))return[];const t=await r.text(),d=new DOMParser().parseFromString(t,'text/html');return[...new Set([...d.querySelectorAll('a')].map(a=>a.getAttribute('href')||'').filter(x=>/\.pdf(?:$|\?)/i.test(x)).map(x=>decodeURIComponent(x.split('?')[0].split('/').pop())))].map(n=>({file:n,title:clean(n),pdf:`${DIR}/${encodeURIComponent(n)}`,cover:`portadas/${encodeURIComponent(n.replace(/\.pdf$/i,'.webp'))}`}))}catch(e){return[]}}
async function githubDiscover(){try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}?ref=main`,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(!r.ok)return[];const a=await r.json();if(!Array.isArray(a))return[];return a.filter(x=>x.type==='file'&&/\.pdf$/i.test(x.name)).map(x=>({file:x.name,title:clean(x.name),pdf:`${DIR}/${encodeURIComponent(x.name)}`,cover:`portadas/${encodeURIComponent(x.name.replace(/\.pdf$/i,'.webp'))}`}))}catch(e){return[]}}
async function discover(){let base=await staticCatalog();renderLibrary(base);let live=await localDiscover();if(!live.length)live=await githubDiscover();if(live.length){const m=new Map(base.map(x=>[x.file,x]));live.forEach(x=>m.set(x.file,{...(m.get(x.file)||{}),...x}));base=[...m.values()]}books=base.sort((a,b)=>a.title.localeCompare(b.title,'es',{sensitivity:'base'}));renderLibrary(books)}
function renderLibrary(list){const g=$('#grid');g.innerHTML='';if(!list.length){g.innerHTML='<div class="status">No se encontraron publicaciones.</div>';return}list.forEach(b=>{const c=document.createElement('button');c.className='card';c.innerHTML='<div class="book"><div class="spine"></div><div class="cover"><img loading="lazy"></div><div class="pages"></div></div><div class="label"><span class="title"></span><span class="meta"></span></div>';c.querySelector('.title').textContent=b.title;c.querySelector('.meta').textContent=b.pages?`${b.pages} páginas`:'PDF';const img=c.querySelector('img');img.src=b.cover||'';img.alt=b.title;img.onerror=()=>img.style.display='none';c.onclick=()=>openBook(b);g.appendChild(c)})}
function touch(i){accessOrder=accessOrder.filter(x=>x!==i);accessOrder.push(i)}function cleanup(){let guard=0;while(accessOrder.length>36&&guard++<100){const i=accessOrder.shift();if(Math.abs(i-currentIndex)<=prefetchDepth+2){accessOrder.push(i);continue}const u=pageCache.get(i);if(u){URL.revokeObjectURL(u);pageCache.delete(i)}}}
async function renderPageImage(i){if(i<0||!pdfDoc||i>=pdfDoc.numPages)return null;if(pageCache.has(i)){touch(i);return pageCache.get(i)}if(renderJobs.has(i))return renderJobs.get(i);const gen=renderGeneration;const job=(async()=>{const p=await pdfDoc.getPage(i+1),v0=p.getViewport({scale:1}),targetH=Math.min(1700,Math.max(950,innerHeight*1.45)),v=p.getViewport({scale:targetH/v0.height}),cv=document.createElement('canvas');cv.width=Math.ceil(v.width);cv.height=Math.ceil(v.height);await p.render({canvasContext:cv.getContext('2d',{alpha:false}),viewport:v}).promise;if(gen!==renderGeneration)return null;const blob=await new Promise(res=>cv.toBlob(res,'image/webp',.8));if(!blob)return null;const url=URL.createObjectURL(blob);pageCache.set(i,url);touch(i);renderJobs.delete(i);cleanup();return url})().catch(e=>{renderJobs.delete(i);console.warn(e);return null});renderJobs.set(i,job);return job}
function detectPortrait(){const st=$('#stage').getBoundingClientRect();return matchMedia('(max-width:760px)').matches||st.width<720}function norm(i){if(!pdfDoc)return 0;i=Math.max(0,Math.min(pdfDoc.numPages-1,i));if(!portraitMode&&i>0)i=i%2===1?i:i-1;return Math.max(0,i)}function visible(){if(portraitMode)return[currentIndex,null];if(currentIndex===0)return[null,0];return[currentIndex,currentIndex+1<pdfDoc.numPages?currentIndex+1:null]}
function layout(){if(!pdfDoc||$('#viewer').hidden)return;portraitMode=detectPortrait();const st=$('#stage').getBoundingClientRect(),pages=portraitMode?1:2,aw=Math.max(240,st.width-(innerWidth<760?6:110)),ah=Math.max(260,st.height-16);let h=Math.min(ah,(aw/pages)/pageRatio),w=h*pageRatio;w*=zoom;h*=zoom;const mh=ah*.98,mw=(aw/pages)*.98;if(h>mh){h=mh;w=h*pageRatio}if(w>mw){w=mw;h=w/pageRatio}$('#spread').style.width=(w*pages+(portraitMode?0:2))+'px';$('#spread').style.height=h+'px';[$('#leftSheet'),$('#rightSheet')].forEach(el=>{el.style.width=w+'px';el.style.height=h+'px'})}
async function showCurrent(){if(!pdfDoc)return;const [li,ri]=visible(),left=$('#leftSheet'),right=$('#rightSheet'),gut=$('#gutter');if(portraitMode){left.style.display='none';gut.style.display='none';right.style.display='block';const u=await renderPageImage(currentIndex);if(u)$('#rightImg').src=u}else{left.style.display='block';right.style.display='block';gut.style.display='block';if(li===null){left.classList.add('blank');$('#leftImg').removeAttribute('src')}else{left.classList.remove('blank');const u=await renderPageImage(li);if(u)$('#leftImg').src=u}if(ri===null){right.classList.add('blank');$('#rightImg').removeAttribute('src')}else{right.classList.remove('blank');const u=await renderPageImage(ri);if(u)$('#rightImg').src=u}}updateCounter();requestAnimationFrame(layout);prefetch()}
function updateCounter(){const p=currentIndex+1;$('#counter').textContent=`${p} / ${pdfDoc?pdfDoc.numPages:1}`;$('#range').value=p}
async function prefetch(){if(!pdfDoc)return;const now=Date.now();if(now-lastTurnAt<900)fastTurns=Math.min(6,fastTurns+1);else fastTurns=Math.max(0,fastTurns-1);prefetchDepth=fastTurns>=3?24:fastTurns>=1?16:10;const order=[];for(let d=1;d<=prefetchDepth;d++)order.push(currentIndex+d);for(let d=1;d<=6;d++)order.push(currentIndex-d);for(const i of order){if(i>=0&&i<pdfDoc.numPages&&!pageCache.has(i)&&!renderJobs.has(i)){renderPageImage(i);await new Promise(r=>setTimeout(r,0))}}}
async function animateTurn(dir){if(busy||!pdfDoc)return;const step=portraitMode?1:2,target=norm(currentIndex+(dir==='next'?step:-step));if(target===currentIndex)return;busy=true;lastTurnAt=Date.now();const tv=portraitMode?[target]:target===0?[0]:[target,target+1].filter(i=>i<pdfDoc.numPages);await Promise.all(tv.map(renderPageImage));const layer=$('#flipLayer');layer.innerHTML='';const fp=document.createElement('div');fp.className='flip-page '+(dir==='next'?'forward':'backward');const front=document.createElement('div'),back=document.createElement('div');front.className='flip-face';back.className='flip-face flip-back';const [li,ri]=visible(),fi=dir==='next'?(portraitMode?currentIndex:(ri??li)):(portraitMode?currentIndex:(li??ri)),bi=dir==='next'?tv[0]:tv[tv.length-1];if(fi!=null&&pageCache.get(fi)){const im=document.createElement('img');im.src=pageCache.get(fi);front.appendChild(im)}if(bi!=null&&pageCache.get(bi)){const im=document.createElement('img');im.src=pageCache.get(bi);back.appendChild(im)}fp.append(front,back);layer.appendChild(fp);currentIndex=target;setTimeout(showCurrent,150);fp.addEventListener('animationend',()=>{layer.innerHTML='';busy=false;prefetch()},{once:true});setTimeout(()=>{if(busy){layer.innerHTML='';busy=false;showCurrent()}},600)}
async function openBook(b){currentBook=b;zoom=1;currentIndex=0;busy=false;fastTurns=0;renderGeneration++;for(const u of pageCache.values())URL.revokeObjectURL(u);pageCache.clear();renderJobs.clear();accessOrder=[];$('#viewer').hidden=false;document.body.style.overflow='hidden';$('#vtitle').textContent=b.title;$('#loading').classList.remove('off');$('#loadText').textContent='Preparando primeras páginas…';$('#progress').textContent='';try{pdfDoc=await pdfjsLib.getDocument({url:b.pdf,disableAutoFetch:false,disableStream:false,disableRange:false}).promise;const p=await pdfDoc.getPage(1),v=p.getViewport({scale:1});pageRatio=v.width/v.height;$('#range').max=pdfDoc.numPages;layout();const initial=[0,1,2,3].filter(i=>i<pdfDoc.numPages);let done=0;for(const i of initial){await renderPageImage(i);done++;$('#progress').textContent=`${done}/${initial.length}`;if(done>=2&&!$('#loading').classList.contains('off')){await showCurrent();$('#loading').classList.add('off')}}await showCurrent();$('#loading').classList.add('off');prefetch()}catch(e){console.error(e);$('#loadText').textContent='No se pudo abrir este PDF.';$('#progress').textContent=''}}
async function closeViewer(){renderGeneration++;for(const u of pageCache.values())URL.revokeObjectURL(u);pageCache.clear();renderJobs.clear();accessOrder=[];if(pdfDoc)try{await pdfDoc.destroy()}catch(e){}pdfDoc=null;currentBook=null;$('#viewer').hidden=true;document.body.style.overflow=''}
$('#prev').onclick=$('#bprev').onclick=()=>animateTurn('prev');$('#next').onclick=$('#bnext').onclick=()=>animateTurn('next');$('#range').oninput=async e=>{if(!pdfDoc||busy)return;currentIndex=norm(+e.target.value-1);await showCurrent()};$('#back').onclick=closeViewer;$('#full').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await $('#viewer').requestFullscreen()}catch(e){console.warn(e)}};$('#zoomIn').onclick=()=>{zoom=Math.min(1.35,zoom+.1);layout()};$('#zoomOut').onclick=()=>{zoom=Math.max(.75,zoom-.1);layout()};let rt;function relayout(){clearTimeout(rt);rt=setTimeout(async()=>{if(!pdfDoc||$('#viewer').hidden)return;const oldPortrait=portraitMode,old=currentIndex;layout();if(oldPortrait!==portraitMode){currentIndex=norm(old);await showCurrent()}},80)}addEventListener('resize',relayout,{passive:true});addEventListener('orientationchange',()=>setTimeout(relayout,120),{passive:true});document.addEventListener('fullscreenchange',()=>requestAnimationFrame(relayout));addEventListener('keydown',e=>{if($('#viewer').hidden)return;if(e.key==='ArrowRight')animateTurn('next');if(e.key==='ArrowLeft')animateTurn('prev');if(e.key==='Escape'&&!document.fullscreenElement)closeViewer()});document.addEventListener('contextmenu',e=>{if(!$('#viewer').hidden)e.preventDefault()});$('#refresh').onclick=discover;discover();
</script></body></html>
